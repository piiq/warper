name: Feature request
description: Suggest a change to Warper.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Describe the task or problem you encounter while using the terminal.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
