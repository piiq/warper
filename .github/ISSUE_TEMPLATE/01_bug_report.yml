name: Bug report
description: Report a problem with Warper.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can it be reproduced?
      description: Include the commands, settings, or steps involved.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, shell, and Warper version or commit.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal information before attaching logs.
