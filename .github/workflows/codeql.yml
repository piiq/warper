name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            runner: macos-latest
          - language: actions
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      # Analyze the supported desktop configuration, without profiling/experimental Cargo features.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_FEATURES: '["default"]'
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Rust's none mode still runs build scripts and procedural macros.
      - name: Prepare native Rust dependencies
        if: matrix.language == 'rust'
        uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: /language:${{ matrix.language }}
